<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a0806">
<title>GO-TAROT · 이야기로 읽는 타로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Song+Myung&family=Cinzel+Decorative:wght@400;700&display=swap">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 인트로 + 접속코드: 공개 화면. 내용은 여기 없고, 코드로 풀어야 불러온다 -->
<section id="intro" class="intro" aria-label="GO-TAROT 시작 화면">
  <div class="intro-sky" aria-hidden="true"></div>
  <svg class="intro-geo" viewBox="0 0 400 400" aria-hidden="true">
    <g class="geo-spin">
      <circle class="g" style="--d:0s" cx="200" cy="200" r="184" pathLength="1"/>
      <circle class="g thin" style="--d:.3s" cx="200" cy="200" r="150" pathLength="1"/>
      <polygon class="g" style="--d:.7s" points="200,16 384,200 200,384 16,200" pathLength="1"/>
      <polygon class="g" style="--d:1.1s" points="200,50 330,275 70,275" pathLength="1"/>
      <polygon class="g" style="--d:1.4s" points="200,350 330,125 70,125" pathLength="1"/>
    </g>
  </svg>

  <div class="intro-inner">
    <p class="eyebrow">Tarot · Story · Geometry</p>
    <h1 class="logo">GO-TAROT</h1>
    <p class="intro-sub">이야기로 읽는 타로</p>

    <div class="orb-wrap" id="orb-wrap">
      <button class="orb" id="orb" type="button" aria-label="접속 코드 입력하기" style="--power:0">
        <span class="orb-mist m1"></span><span class="orb-mist m2"></span><span class="orb-mist m3"></span>
        <span class="orb-core"></span><span class="orb-glint"></span>
      </button>
      <div class="orb-stand" aria-hidden="true"><i></i></div>
    </div>
    <p class="orb-hint" id="orb-hint">수정구슬에 접속 코드를 들려주세요</p>

    <form id="gate" class="gate" autocomplete="off">
      <label class="cells" id="cells" for="code">
        <span class="sr">접속 코드 12자리</span>
        <span class="cell-group"><i></i><i></i><i></i><i></i></span><b>·</b>
        <span class="cell-group"><i></i><i></i><i></i><i></i></span><b>·</b>
        <span class="cell-group"><i></i><i></i><i></i><i></i></span>
        <input id="code" name="code" class="code-input" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="14" enterkeyhint="go">
      </label>
      <label class="remember" id="remember-row"><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
      <button type="submit" class="gate-btn"><span>입장하기</span></button>
      <p class="gate-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<!-- 앱: 접속코드가 맞으면 열린다 -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <a href="#/" class="brand"><span class="brand-mark">✦</span> GO-TAROT</a>
    <nav class="quick" aria-label="주요 메뉴">
      <a href="#/" data-nav="home">홈</a>
      <a href="#/cards/major" data-nav="cards">카드</a>
      <a href="#/story/major" data-nav="story">이야기</a>
      <a href="#/learn/reading" data-nav="learn">배우기</a>
      <a href="#/review" data-nav="review">복습</a>
      <a href="#/notes" data-nav="notes">노트</a>
    </nav>
    <a href="#/search" class="icon-btn" aria-label="검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></a>
    <button class="icon-btn menu-btn" id="menu-btn" aria-expanded="false" aria-controls="index" aria-label="목차 열기">
      <span class="burger"><i></i><i></i><i></i></span><span class="menu-label">목차</span>
    </button>
  </header>
  <div class="index-scrim" id="index-scrim" hidden></div>
  <nav id="index" class="index-panel" aria-label="목차" hidden></nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
